name: Build production image

# Fork-only workflow. Builds a single linux/amd64 image and publishes it to this
# repository's GitHub Container Registry:
#   push to branch `production`   -> :production and :git-<short sha>
#   push of tag `vX.Y.Z-production` -> :X.Y.Z-production and :git-<short sha>
#     e.g. tag v0.13.4-production -> ghcr.io/<owner>/open-webui:0.13.4-production
#
# Deliberately uses NO `uses:` actions (only git and docker already present on
# the runner), because the fork's Actions policy only allows actions owned by
# the repository owner. Kept separate from upstream's docker.yaml so upstream
# merges don't conflict.

on:
  workflow_dispatch:
  push:
    branches:
      - production
    tags:
      - 'v*-production'

concurrency:
  group: production-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Check out repository
        run: |
          auth="$(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 -w0)"
          echo "::add-mask::${auth}"
          git init src
          cd src
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -c "http.extraheader=AUTHORIZATION: basic ${auth}" \
            fetch --depth 1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD

      # The frontend build needs a bigger Node heap than the default.
      - name: Prepare CI Dockerfile
        run: |
          awk '
            /^FROM --platform=\$BUILDPLATFORM node:/ {
              print
              print "ENV NODE_OPTIONS=\"--max-old-space-size=12288\""
              next
            }
            { print }
          ' src/Dockerfile > "${RUNNER_TEMP}/Dockerfile"

      - name: Log in to GitHub Container Registry
        run: |
          echo "${GITHUB_TOKEN}" | docker login ghcr.io \
            --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          short_sha="${GITHUB_SHA::7}"

          tags=(--tag "${image}:git-${short_sha}")
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # v0.13.4-production -> 0.13.4-production (leading "v" dropped, as upstream does)
            tags+=(--tag "${image}:${GITHUB_REF_NAME#v}")
          else
            tags+=(--tag "${image}:production")
          fi

          # A docker-container builder is needed for registry layer caching.
          docker buildx create --name ci --driver docker-container --use

          docker buildx build \
            --file "${RUNNER_TEMP}/Dockerfile" \
            --platform linux/amd64 \
            "${tags[@]}" \
            --build-arg "BUILD_HASH=${GITHUB_SHA}" \
            --build-arg "BUILD_CHANNEL=production" \
            --cache-from "type=registry,ref=${image}:cache-production" \
            --cache-to "type=registry,ref=${image}:cache-production,mode=max" \
            --push \
            src
